name: CI and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      PROP_SEEDS: '100'
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Property tests (reduced seeds)
        # Seating/puzzle runtime generators are not served (the app ships pre-verified banks, re-verified by the
        # *-banks suites below); their slow solver suites run locally before bank builds.
        run: npx vitest run tests/property --exclude tests/property/reasoning/seating.test.ts --exclude tests/property/reasoning/puzzles.test.ts
      - name: Content gate (schema + blind-solve verification + bank index)
        run: npm run banks
      - name: Build
        run: npx vite build
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end (360 px + smoke on Pixel 7 / iPhone 13 geometry)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
